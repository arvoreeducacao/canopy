# Cloud mode example — a self-hosted browser-in-the-cloud with the cockpit.
# See "Cloud mode" in the README. Put a TLS-terminating reverse proxy in front
# (Traefik, Caddy, nginx) and point CANOPY_PUBLIC_HOST at its hostname.
services:
  canopy:
    build: .
    restart: unless-stopped
    environment:
      # The API key agents use on /mcp and REST. Never run cloud mode without it.
      - CANOPY_TOKEN=${CANOPY_TOKEN:?set a strong random token}
      # Hostname(s) your proxy forwards — comma-separated (Host-header allowlist).
      - CANOPY_PUBLIC_HOST=${CANOPY_PUBLIC_HOST:?e.g. canopy.example.com}
      # Optional: mark one host as SSO-protected by your proxy's forward-auth.
      # CANOPY_SSO_SECRET is required for SSO to be honoured at all — the proxy
      # must inject it as X-Canopy-SSO-Secret. Identity headers only mean
      # something on traffic that actually went through the proxy, and the
      # shared secret is what establishes that. Without it Canopy leaves SSO
      # off rather than accept a weaker path to authentication.
      # - CANOPY_SSO_HOST=canopy.example.com
      # - CANOPY_SSO_SECRET=${CANOPY_SSO_SECRET}
      # - CANOPY_SSO_HEADER=x-auth-request-email
      # Optional: the origin the cockpit shows in its "connect an agent" command.
      # - CANOPY_MCP_ORIGIN=https://canopy-mcp.example.com
    volumes:
      - canopy-data:/data # token, recordings and the Chromium profile (logins persist)
    expose:
      - 4664
    shm_size: 1gb
    # Chromium runs with --no-sandbox in here (Docker's seccomp profile blocks
    # the namespace it needs), so a renderer bug is code execution next to the
    # logged-in profile on /data. Keep the blast radius small.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512

volumes:
  canopy-data:
