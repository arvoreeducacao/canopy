name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            files: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            args: --win
            files: dist/*.exe
          - os: ubuntu-latest
            args: --linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron-builder ${{ matrix.args }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          draft: false
