<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Nova aba</title>
  <style>
    :root {
      --bg1: #f4f1fb;
      --bg2: #e9f4f1;
      --fg: rgba(40, 35, 60, 0.9);
      --fg-dim: rgba(40, 35, 60, 0.45);
      --box: rgba(255, 255, 255, 0.75);
      --border: rgba(120, 110, 150, 0.15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #1d1b26;
        --bg2: #1a2320;
        --fg: rgba(240, 238, 250, 0.92);
        --fg-dim: rgba(240, 238, 250, 0.4);
        --box: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.09);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      color: var(--fg);
    }

    #brand {
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
    }

    #brand svg {
      color: #10B981;
    }

    #brand span {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    #clock {
      font-size: 15px;
      color: var(--fg-dim);
      user-select: none;
      margin-top: -18px;
    }

    #search {
      width: min(560px, 84vw);
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--box);
      backdrop-filter: blur(20px);
      padding: 0 20px;
      font-size: 16px;
      font-family: inherit;
      color: var(--fg);
      outline: none;
      box-shadow: 0 4px 24px rgba(20, 10, 50, 0.07);
    }

    #search::placeholder {
      color: var(--fg-dim);
    }

    #search:focus {
      border-color: rgba(16, 185, 129, 0.45);
    }

    #hint {
      font-size: 12px;
      color: var(--fg-dim);
      user-select: none;
    }

    #hint kbd {
      font-family: inherit;
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="brand">
    <svg viewBox="0 0 32 32" width="38" height="38"><path d="M16 28V14M16 14c0-5 3-9 9-10-1 6-4 9-9 10zM16 18c0-4-2.5-7-7-8 .8 4.6 3 7 7 8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Galho</span>
  </div>
  <div id="clock"></div>
  <input id="search" placeholder="Buscar no Google ou digitar URL" autofocus>
  <div id="hint"><kbd>&#8984;T</kbd> abre o comando rapido de qualquer lugar</div>
  <script>
    const clock = document.getElementById('clock')
    function tick() {
      const now = new Date()
      const dias = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado']
      clock.textContent = dias[now.getDay()] + ', ' + now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    }
    tick()
    setInterval(tick, 10000)

    const search = document.getElementById('search')
    search.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return
      const q = search.value.trim()
      if (!q) return
      const urlish = /^[a-z][a-z0-9+.-]*:\/\//i.test(q) || /^localhost(:\d+)?(\/|$)/.test(q) || (!q.includes(' ') && q.includes('.'))
      if (urlish) {
        window.location.href = /^[a-z][a-z0-9+.-]*:\/\//i.test(q) ? q : 'https://' + q
      } else {
        window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q)
      }
    })
  </script>
</body>
</html>
