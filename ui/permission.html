<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Permission</title>
  <style>
    :root {
      --card: rgba(252, 251, 255, 0.98);
      --fg: rgba(32, 28, 48, 0.96);
      --fg-dim: rgba(32, 28, 48, 0.6);
      --line: rgba(120, 110, 150, 0.16);
      --ghost: rgba(30, 20, 60, 0.06);
      --ghost-hover: rgba(30, 20, 60, 0.11);
      --accent: #45D0C1;
      --accent-ink: #0C332F;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --card: rgba(34, 32, 44, 0.98);
        --fg: rgba(242, 240, 250, 0.96);
        --fg-dim: rgba(242, 240, 250, 0.6);
        --line: rgba(255, 255, 255, 0.09);
        --ghost: rgba(255, 255, 255, 0.09);
        --ghost-hover: rgba(255, 255, 255, 0.15);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      user-select: none;
    }

    #card {
      margin: 14px 16px 20px 14px;
      padding: 15px 17px 13px 17px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 4px 14px rgba(10, 5, 30, 0.10);
      color: var(--fg);
      animation: drop 200ms cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    @keyframes drop {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    #head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    #glyph {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--ghost);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--fg);
    }

    #text {
      flex: 1;
      min-width: 0;
      padding-top: 1px;
    }

    #title {
      font-size: 13.5px;
      line-height: 1.35;
      font-weight: 500;
    }

    #title b {
      font-weight: 650;
    }

    #note {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--fg-dim);
    }

    #actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      justify-content: flex-end;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 8px 15px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: default;
      transition: background 0.12s;
    }

    #block {
      background: var(--ghost);
      color: var(--fg);
    }

    #block:hover { background: var(--ghost-hover); }

    #allow {
      background: var(--accent);
      color: var(--accent-ink);
    }

    #allow:hover { filter: brightness(1.08); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="head">
      <div id="glyph"></div>
      <div id="text">
        <div id="title"></div>
        <div id="note"></div>
      </div>
    </div>
    <div id="actions">
      <button id="block"></button>
      <button id="allow"></button>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script>
    const GLYPHS = {
      camera: '<svg viewBox="0 0 20 20" width="18" height="18"><rect x="1.5" y="5" width="12" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13.5 9.5l5-2.5v6l-5-2.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
      microphone: '<svg viewBox="0 0 20 20" width="18" height="18"><rect x="7.5" y="2" width="5" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 9a5.5 5.5 0 0 0 11 0M10 14.5V18M7 18h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
      screen: '<svg viewBox="0 0 20 20" width="18" height="18"><rect x="2" y="3.5" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 17.5h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
      location: '<svg viewBox="0 0 20 20" width="18" height="18"><path d="M10 18s6-5.4 6-10a6 6 0 1 0-12 0c0 4.6 6 10 6 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
      notifications: '<svg viewBox="0 0 20 20" width="18" height="18"><path d="M5 8a5 5 0 0 1 10 0c0 4 1.5 5.5 1.5 5.5h-13S5 12 5 8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 16a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
      clipboard: '<svg viewBox="0 0 20 20" width="18" height="18"><rect x="4.5" y="3.5" width="11" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 3.5V2.8c0-.7.6-1.3 1.3-1.3h2.4c.7 0 1.3.6 1.3 1.3v.7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'
    }

    const title = document.getElementById('title')
    const note = document.getElementById('note')
    const glyph = document.getElementById('glyph')
    const allow = document.getElementById('allow')
    const block = document.getElementById('block')

    allow.textContent = T('permAllow')
    block.textContent = T('permBlock')
    note.textContent = T('permRememberNote')

    const answer = granted => window.galho.send('permission:answer', { granted })

    allow.onclick = () => answer(true)
    block.onclick = () => answer(false)
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') answer(false)
      if (e.key === 'Enter') answer(true)
    })

    window.galho.on('permission:ask', data => {
      glyph.innerHTML = GLYPHS[data.glyph] || GLYPHS.notifications
      title.innerHTML = ''
      const strong = document.createElement('b')
      strong.textContent = data.host
      title.appendChild(strong)
      title.appendChild(document.createTextNode(' ' + data.what))
    })
  </script>
</body>
</html>
