<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Palette</title>
  <style>
    :root {
      --space-color: #8B5CF6;
      --box-bg: rgba(250, 249, 253, 0.92);
      --fg: rgba(35, 30, 55, 0.95);
      --fg-dim: rgba(35, 30, 55, 0.5);
      --sel: rgba(120, 90, 220, 0.12);
      --border: rgba(120, 110, 150, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --box-bg: rgba(38, 36, 48, 0.94);
        --fg: rgba(242, 240, 250, 0.95);
        --fg-dim: rgba(242, 240, 250, 0.5);
        --sel: rgba(160, 130, 255, 0.18);
        --border: rgba(255, 255, 255, 0.1);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    html, body {
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
    }

    #backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 10, 30, 0.18);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 14vh;
    }

    #box {
      width: min(640px, 86vw);
      background: var(--box-bg);
      backdrop-filter: blur(28px);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(10, 5, 30, 0.35), 0 2px 8px rgba(10, 5, 30, 0.12);
      overflow: hidden;
    }

    #input-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 15px 18px;
    }

    #input-row svg {
      color: var(--space-color);
      flex-shrink: 0;
    }

    #query {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 17px;
      color: var(--fg);
      font-family: inherit;
    }

    #query::placeholder {
      color: var(--fg-dim);
    }

    #mode-chip {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--space-color);
      border: 1px solid color-mix(in srgb, var(--space-color) 40%, transparent);
      border-radius: 6px;
      padding: 2px 7px;
      display: none;
    }

    #results {
      border-top: 1px solid var(--border);
      padding: 7px;
      max-height: 56vh;
      overflow-y: auto;
    }

    #results:empty {
      display: none;
    }

    .result {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      border-radius: 10px;
      cursor: default;
    }

    .result.selected {
      background: var(--sel);
    }

    .result .r-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg-dim);
      flex-shrink: 0;
    }

    .result .r-icon img {
      width: 17px;
      height: 17px;
      border-radius: 4px;
    }

    .result .r-body {
      flex: 1;
      min-width: 0;
    }

    .result .r-title {
      font-size: 13.5px;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result .r-sub {
      font-size: 11.5px;
      color: var(--fg-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .result .r-hint {
      font-size: 11px;
      color: var(--fg-dim);
      opacity: 0;
    }

    .result.selected .r-hint {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="backdrop">
    <div id="box">
      <div id="input-row">
        <svg viewBox="0 0 20 20" width="18" height="18"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="query" placeholder="Buscar, abrir URL ou executar acao..." autofocus>
        <span id="mode-chip">ABRIR AQUI</span>
      </div>
      <div id="results"></div>
    </div>
  </div>
  <script src="palette.js"></script>
</body>
</html>
